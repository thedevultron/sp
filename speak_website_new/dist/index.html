session in place, plus custom actions. - [Token bar and purge](https://voxula.ai/#/docs#docs-context): live context meter, Ctrl + Win to reset.","weight":3},{"id":2,"source":"overview","text":"- [Canvas and tray](https://voxula.ai/#/docs#docs-canvas): screen ink layer and system-tray controls. - [Settings](https://voxula.ai/#/docs#docs-settings): Setup, Guide, Preferences, and Refine tabs. - [AI Engine](https://voxula.ai/#/docs#docs-models): dictation, companion, and refine engines with automatic fallback. - [Security and privacy](https://voxula.ai/#/docs#docs-security): Credential Manager keys, direct AI connections, no telemetry. - [Troubleshooting](https://voxula.ai/#/docs#docs-troubleshooting): mic, speaker, key, and connection fixes.","weight":3},{"id":3,"source":"overview","text":"- [Download Installer (SPEAK_Setup_v2.1.exe)](https://github.com/codedebuggalt/voxula_ai_installer/raw/main/SPEAK_Setup_v2.1.exe): native x64, Windows 10 / 11, free forever. - [GitHub Repository](https://github.com/codedebuggalt/voxula_ai_installer): official repository and setup executable.","weight":3},{"id":4,"source":"docs","text":"const toc Get started , docs-start , Dictation , docs-dictation , Companion , docs-companion , Refine , docs-refine , Context & purge , docs-context , Canvas & tray , docs-canvas , Settings , docs-settings , Models , docs-models , Security & privacy , docs-security , Troubleshooting , docs-troubleshooting , as const","weight":3},{"id":5,"source":"docs","text":"export default function DocsPage onDownload : onDownload: void const active, setActive useState docs-start","weight":3},{"id":6,"source":"docs","text":"useEffect const sections toc .map , id document.getElementById id .filter el : el is HTMLElement el ! null if !sections.length return const observer new IntersectionObserver entries entries.forEach entry if entry.isIntersecting setActive entry.target.id , rootMargin: -12% 0px -70% 0px sections.forEach s observer.observe s return observer.disconnect ,","weight":3},{"id":7,"source":"docs","text":"return Installation guide SITE_VERSION · 10 sections toc.map label, id , i String i + 1 .padStart 2, 0 label Get the installer","weight":3},{"id":8,"source":"docs","text":"DOCS · VOXULA AI SITE_VERSION.toUpperCase How to use Voxula AI. Setup, dictation, companion, refine, context, canvas, settings, security — everything the app does, on one page. New here? Start with the installer, then the 3-step flow. Install → add an API key → focus any app and press Ctrl + Space. The simulator on the home page mirrors this flow, including refine.","weight":3},{"id":9,"source":"docs","text":"01 · GET STARTED Install and connect. 01 Install Voxula AI for Windows. Run the installer INSTALLER_FILE INSTALLER_SIZE , Windows 10 Build 19041+ or Windows 11, 64-bit, DirectX 11+ . Hosted on GitHub voxula_ai_installer . No admin rights needed. Optional desktop / startup shortcuts, uninstaller included. Direct download .exe 02 Bring an API key. Voxula AI auto-detects GEMINI_API_KEY , or open Settings → Setup to paste a primary + backup key. Keys live in Windows Credential Manager, never in plain files. Get a free key 03 Focus any app and speak. Put your cursor in Notepad, Word, VS Code, Slack, Discord, or a browser field. Press Ctrl + Space and talk — words type at your cursor, sub-second.","weight":3},{"id":10,"source":"docs","text":"Get the installer GitHub Repo","weight":3},{"id":11,"source":"docs","text":"02 · DICTATION Live voice dictation. Hotkey: Ctrl + Space — toggle on / off. Streams mic audio 16 kHz mono to live transcription. Types directly at the cursor in whatever app is focused — multilingual auto-detect, sub-second. Capsule shows live status, sound-wave visualizer mic vs. voice , interim preview, and token bar. Press Ctrl + Space again to stop. Capsule hides to the tray.","weight":3},{"id":12,"source":"docs","text":"03 · COMPANION Multimodal live companion. Hotkey: Win + Shift — voice + optional screen share. Real-time voice conversation replies play through your speakers capsule shows Speaking… / Listening… / Working… . Optional live screen sharing ~1 fps JPEG so the assistant sees your desktop. Toggle anytime via the capsule monitor button or Settings → Live Screen — mid-session, audio keeps running. Voice desktop control: powered by the AI Engine — tell it “click Send” , “scroll down” , “press Ctrl+S” . It acts on what it sees, one step at a time, narrating as it goes. Say stop to halt instantly. Screen-off mode voice-only companion.","weight":3},{"id":13,"source":"docs","text":"Screen frames stream only while a session is active, and only to Google s AI service.","weight":3},{"id":14,"source":"docs","text":"04 · REFINE Say “refine” — it refines. Voice triggers: refine · polish · elaborate plus expand alias . Or tap capsule buttons / tray → Refine. Rewrites everything typed this session since purge or dictation start . Delete-and-replace: the original is removed with measured Backspaces and the rewrite is typed in place — no clipboard, no Ctrl+A, no Enter presses . Self-correction aware: “could you set meeting at 9pm actually 5pm” → “Could we schedule the meeting for 5:00 PM?” obsolete info dropped, times normalized . If Voxula AI has focus, refine asks you to click your document first , then say the word again — history is kept so retry works.","weight":3},{"id":15,"source":"docs","text":"refine , Clean rewrite — grammar, clarity, structure , polish , Tighten tone — emails, messages, notes , elaborate , Expand the idea — detail, examples, formatting .map k, v k v Try it below-style: dictate something messy in the home-page simulator, then hit Say “refine” and watch it delete and retype the clean version. Custom refine actions up to 3 . Settings → Refine tab : edit the Refine / Polish / Elaborate prompts and their trigger words, or add your own e.g. name Summarize , trigger summarize , custom prompt . They appear immediately in the capsule, tray Refine menu, and voice triggers after Save. Trigger words: a–z 0–9 - , 2–24 chars, must be unique.","weight":3},{"id":16,"source":"docs","text":"05 · CONTEXT Token bar and purge. 3 px bar under the capsule: green 0–60% , orange 61–85% , red 86–100% . Hover reveals exact token counts, session time, and remaining buffer. Ctrl + Win instantly stops the session, clears transcript + typed history + token counter, and hard-resets the connection.","weight":3},{"id":17,"source":"docs","text":"06 · CANVAS & TRAY Draw, then dismiss. Screen canvas: fullscreen transparent ink layer — B / 1–3 color keys, right-click clears, Esc exits. Mark the screen while talking to the companion. System tray: show/hide capsule, Dictation, Companion, Purge, Refine submenu, Guide, Settings, Exit — with notifications for save / refine / speaker / screen events. Capsule hidden? By design hotkey-only : press Ctrl + Space or tray → Show capsule.","weight":3},{"id":18,"source":"docs","text":"07 · SETTINGS Four tabs, full control. S Setup. Primary + backup API keys masked , Test button, free-tier status. G Guide. Shortcut reference, always one click away. P Preferences. Microphone select / refresh, custom vocabulary + signature mark, system prompt, creativity slider, live-screen toggle + frame detail, agent reasoning depth Low / Medium / High , Windows startup. R Refine. Prompts, trigger words, and up to 3 custom actions.","weight":3},{"id":19,"source":"docs","text":"08 · AI ENGINE What runs where. Use Engine Dictation AI Engine speech-to-text Companion live audio + screen + PC control AI Engine with automatic fallback Refine one-shot edit AI Engine with automatic fallback Stored configs with retired IDs self-repair on load. On connection failure the client rotates keys and retries — after 3 failures in 30 s it stops loudly instead of hot-looping.","weight":3},{"id":20,"source":"docs","text":"09 · SECURITY & PRIVACY Your words are yours. Keys live in Windows Credential Manager target SPEAK_AI_App , never in plain files. UI masks them logs mask them. Free-tier fallback key ships obfuscated and is used only when your vault is empty — your keys always win. Config writes are atomic to %APPDATA%\\\\SPEAK_AI\\\\config.json , ACL-restricted to your user all values sanitized on load. Typing uses SendInput unicode multilingual-safe . Clipboard never used for injection no Enter synthesized. Single-instance lock, debounced hotkeys, bounded queues. Mic + screen stream only during an active session, only to Google s AI service. Transcript history resets every launch no restore .","weight":3},{"id":21,"source":"docs","text":"No analytics, no accounts.","weight":3},{"id":22,"source":"docs","text":"10 · TROUBLESHOOTING Back to flow, fast. Companion shows “Model unavailable, trying next…” then “Live connect failed” , Keys invalid / quota, or network. Settings → Setup → Test key add a backup key. , “Speaker error / reply dropped”, no voice , Output device busy or missing. Check speaker, restart companion. , “Mic silent / Mic Error” , Wrong input device. Preferences → Microphone → Refresh. , Refine says “Click your document, then ” , Capsule had focus. Click the target app, say the trigger again hands-free works best . , Capsule hidden , By design hotkey-only . Ctrl+Space, or tray → Show capsule.","weight":3},{"id":23,"source":"docs","text":", Live connect keeps failing , Bad stored engine IDs self-repair on load otherwise check keys / network. , .map q, a q a This site is a preview: the simulator uses sample text and never touches your mic, screen, or keys.","weight":3},{"id":24,"source":"features","text":"export type PillarKey voice | vision | keys | context | custom | refine","weight":2},{"id":25,"source":"features","text":"export interface Pillar key: PillarKey tag: string title: string text: string foot: string span: string","weight":2},{"id":26,"source":"features","text":"export const PILLARS: Pillar key: voice , tag: INSTANT DICTATION , title: Your voice. Direct to cursor. , text: Live dictation streamed at 16 kHz and typed at your cursor — any app, sub-second, multilingual auto-detect. , foot: Ctrl + Space , span: vox-span-4 , , key: vision , tag: MULTIMODAL COMPANION , title: An AI that sees — and acts. , text: A voice companion on the AI Engine: optional ~1 fps screen share plus voice desktop control — click Send , scroll down — narrated step by step. , foot: Win + Shift , span: vox-span-2 , , key: keys , tag: MULTI-KEY ENGINE , title: Stay in flow. Never in a queue. , text: Primary + backup keys in Windows Credential Manager.","weight":2},{"id":27,"source":"features","text":"On rate limits or drops, Voxula AI rotates keys and reconnects. , foot: Always connected , span: vox-span-2 , , key: context , tag: SMART CONTEXT , title: Full context. Full control. , text: Live token bar: green 0–60%, orange 61–85%, red 86–100%. Hover for exact tokens and session time. Purge anytime. , foot: Ctrl + Win , span: vox-span-4 , , key: custom , tag: CUSTOM ACTIONS , title: Teach it your own words. , text: Up to 3 custom refine actions with your own trigger words — say summarize and the whole session obeys. Craft them in Settings → Refine. , foot: Settings → Refine , span: vox-span-3 , , key: refine , tag: REFINE & POLISH , title: Say “refine” — it refines.","weight":2},{"id":28,"source":"features","text":", text: Say refine, polish, or elaborate and the whole session is deleted and retyped, cleaner. Self-correction aware, plus 3 custom actions. , foot: Say “refine” , span: vox-span-3 , ,","weight":2},{"id":29,"source":"desktop-docs","text":"> Voice dictation + live AI companion for Windows 10/11. Speak into any app; the companion can see your screen, press keys, click, type, and remember you. > Version 2.1.0 · By Amir Bagawan · `DOCS.md` (user guide) — dev details live in `FEATURES.md`.","weight":2},{"id":30,"source":"desktop-docs","text":"1. [Install & first run](#1-install--first-run) 2. [Hotkeys cheat sheet](#2-hotkeys-cheat-sheet) 3. [Dictation — speak to type](#3-dictation--speak-to-type) 4. [Companion — live voice + screen](#4-companion--live-voice--screen) 5. [Letting the agent control your screen](#5-letting-the-agent-control-your-screen) 6. [Refine / Polish / Elaborate](#6-refine--polish--elaborate) 7. [Memory — what SPEAK remembers](#7-memory--what-speak-remembers) 8. [Floating capsule (full + mini)](#8-floating-capsule-full--mini) 9. [System tray](#9-system-tray) 10. [Settings guide](#10-settings-guide) 11. [Multi-session + purge](#11-multi-session--purge) 12.","weight":2},{"id":31,"source":"desktop-docs","text":"[AI Engine, tokens & limits](#12-ai-engine-tokens--limits) 13. [Privacy & safety](#13-privacy--safety) 14. [Troubleshooting](#14-troubleshooting)","weight":2},{"id":32,"source":"desktop-docs","text":"1. Install with `installer\\\\SPEAK_Setup_v2.1.exe` (no admin needed) and launch SPEAK. 2. Settings opens fullscreen. Optional: paste an API key (`AIzaSy…` from [Google AI Studio](https://aistudio.google.com/app/apikey)) into **Setup → Primary API key**, click **Test**, then **Save & Launch**. - No key? The built-in free tier works immediately.","weight":2},{"id":33,"source":"desktop-docs","text":"- Add **backup keys** to survive quota errors — SPEAK auto-switches. 3. Pick your microphone in **Preferences** if the default is wrong (use **Refresh** after plugging hardware). 4. The capsule stays hidden until you press a hotkey — SPEAK lives in the system tray near the clock.","weight":2},{"id":34,"source":"desktop-docs","text":"> Startup launch is opt-in only (**Preferences → Launch on Windows startup**).","weight":2},{"id":35,"source":"desktop-docs","text":"All hotkeys are global (work in any app). Keys are never swallowed — other apps keep their behavior.","weight":2},{"id":36,"source":"desktop-docs","text":"| Press | What happens | |---|---| | **Ctrl + Space** | Dictation on/off. Types what you say at the cursor. Press again to stop. | | **Ctrl + /** | Companion on/off. Live voice + screen. Press again to stop. The `/` key is the slash key (US/UK `?` and OEM variants also work). | | **Esc** | Stop whatever is live (dictation or companion). The app keeps running in the tray. Ignored when idle. | | **Ctrl + Win** | Purge: stop session, clear transcript + typed history + token counter, hard-reset the connection. Memory is kept. | | **Ctrl + Tab** | New live session: spawn + switch immediately (old session stored, FIFO eviction applies). |","weight":2},{"id":37,"source":"desktop-docs","text":"Tip: if a chord misfires, release all keys and press it cleanly once — every action is debounced (600 ms).","weight":2},{"id":38,"source":"desktop-docs","text":"Press **Ctrl + Space**, click into any text field (Notepad, Word, browser, chat…), and speak.","weight":2},{"id":39,"source":"desktop-docs","text":"- **Live preview:** interim text appears in the capsule as you talk; finalized words are typed automatically with punctuation. - **Hands stay free:** say `refine`, `polish`, or `elaborate` mid-flow to rewrite the session (see §6). - **Multilingual:** auto-detected, SMART transcription locked on. - **Long sessions:** speech sessions cap previews at ~10 min — SPEAK reconnects automatically on the same key; keep talking. - **Nothing typed?** Click the target app first (SPEAK never types into itself), check **Verification mode** (§10), and watch the capsule wave bars to confirm the mic is live.","weight":2},{"id":40,"source":"desktop-docs","text":"Good first test: open Notepad → **Ctrl + Space** → say *\\"Meeting moved from 9pm actually 5pm\\"* → say *\\"refine\\"* → you get *“Could we schedule the meeting for 5:00 PM?”* typed in place.","weight":2},{"id":41,"source":"desktop-docs","text":"Press **Ctrl + /** for a real-time voice conversation (voice `Aoede`, mic uplink + 24 kHz speaker replies). The capsule shows `Companion (…) + Screen` or `— Voice only`.","weight":2},{"id":42,"source":"desktop-docs","text":"**Screen sharing (default ON, motion-burst vision):**","weight":2},{"id":43,"source":"desktop-docs","text":"1. On first share, approve the OS permission prompt / Settings banner (**Grant Permission**). Voice continues even if screen is blocked. 2. The agent watches the monitor under your cursor (active screen): ~1 JPEG frame/sec when still, reacting within ~0.5 s the moment anything changes. Frames are downscaled (1280 px max, quality 72; MEDIUM detail ≈ 560 tokens each, HIGH ≈ 1120). First live frame confirms `Companion Live + Screen — agent can see`. Vision auto-retries through blips and never quits mid-session — if the AI reports blank, fix permissions first (§14). 3.","weight":2},{"id":44,"source":"desktop-docs","text":"Toggle vision anytime without killing audio: capsule monitor button, **Preferences → Share live screen**, or just ask (*“turn screen share off”* is voice-only from then on). Frame detail (Medium/High) lives in **Preferences → Live Screen**. 4. Each MEDIUM frame costs ~560 tokens — a busy screen at high rates burns context fast, so static moments are skipped automatically. Watch the token bar on long screen sessions.","weight":2},{"id":45,"source":"desktop-docs","text":"**Talk naturally:** interrupt anytime (barge-in flushes stale reply audio), ask follow-ups, dictate messages for it to type.","weight":2},{"id":46,"source":"desktop-docs","text":"The companion types at your cursor and sends with Enter — full authority, no confirmation asks. It always confirms verbally what it sent.","weight":2},{"id":47,"source":"desktop-docs","text":"- *“Type the release note draft, friendly tone, and send it.”* - *“Reply to this email saying I\'ll join at 5, then send.”* - *“Type the command and press Enter.”*","weight":2},{"id":48,"source":"desktop-docs","text":"1. You speak — the AI Engine drafts the text (tone adapts: formal docs/mail, friendly chat, concise code). 2. SPEAK types it at the cursor via Unicode injection (no clipboard). 3. **Auto-Send** (default) presses Enter immediately; **Verification Active** (opt-in, Preferences) waits for your Enter. 4. The capsule status + voice confirm what was sent.","weight":2},{"id":49,"source":"desktop-docs","text":"Full authority means it acts immediately — say exactly what you want sent.","weight":2},{"id":50,"source":"desktop-docs","text":"The agent also operates your PC by voice — click, type into fields, scroll, drag, hotkeys — acting only on what it sees in the live screen frames, one step at a time, narrating as it goes.","weight":2},{"id":51,"source":"desktop-docs","text":"- *“Click the Send button.”* · *“Scroll down twice.”* · *“Open the file menu and click Export.”* - *“Type hello@acme.com in the email field and press Enter.”* · *“Press Ctrl+S.”*","weight":2},{"id":52,"source":"desktop-docs","text":"**Safety governor (always on):** desktop UI actions only (no shell, no background programs); 25-step budget per session; refuses to repeat a failed step (no loops); every action audit-logged; say **stop** (or Esc) to halt instantly. Reasoning depth: **Preferences → Agent Reasoning** (Low/Medium/High, default Medium).","weight":2},{"id":53,"source":"desktop-docs","text":"Rewrite everything typed **this session** (since dictation start or last purge) with one word or click.","weight":2},{"id":54,"source":"desktop-docs","text":"| Action | Say | Does | |---|---|---| | **Refine** | *“refine”* | Fixes transcript: resolves self-corrections (keeps final intent only), drops filler, fixes grammar, normalizes times (`500pm` → `5:00 PM`). | | **Polish** | *“polish”* | Copyedit to publication quality. | | **Elaborate** | *“elaborate”* (`expand` still works) | Expands with detail, examples, structure. |","weight":2},{"id":55,"source":"desktop-docs","text":"**Ways to trigger:** voice mid-dictation · capsule REFINE buttons · tray → Refine submenu.","weight":2},{"id":56,"source":"desktop-docs","text":"**Mechanics:** exact measured delete (Backspaces, no clipboard, no Ctrl+A) + retype, run in parallel for speed. Never presses Enter. If the engine fails after deleting, the original is retyped when focus is safe — otherwise you\'re told it\'s still in the capsule. Custom vocabulary + signature Mark are honored.","weight":2},{"id":57,"source":"desktop-docs","text":"**Custom actions (up to 3):** **Settings → Refine** — name (≤24) + unique trigger (`a-z0-9-`, 2–24 chars) + prompt (≤2000). Appears in capsule + tray + voice instantly after Save. Example: name `Summarize`, trigger `summarize`, prompt `Summarize the following in 3 bullets…`.","weight":2},{"id":58,"source":"desktop-docs","text":"**Rewrite engine:** automatic with built-in fallback. No setup needed.","weight":2},{"id":59,"source":"desktop-docs","text":"The agent keeps small durable facts (name, preferences, project names, vocabulary) across restarts — capped so it stays cheap (~350 tokens max).","weight":2},{"id":60,"source":"desktop-docs","text":"- **Teach it:** *“Remember my deploy key is X.” / “Remember I prefer dark mode.”* → `save_memory` (keep under ~20 words). Capsule/tray confirm `Remembered (…)`. - **Auto-use:** every companion connect prepends your bullet list to its instructions, so replies stay consistent. - **Forget:** *“Forget dark mode.”* → `forget_memory` (id or keyword). Purge does **not** wipe memory. - **Storage:** `%APPDATA%\\\\SPEAK_AI\\\\user_memory.json` — max 30 facts × 140 chars, 1500 total, exact-duplicate proof. Delete the file to wipe fully.","weight":2},{"id":61,"source":"desktop-docs","text":"Always-on-top pill centered above the taskbar. Hidden on startup — appears on hotkey / tray / notification. Never slides under the taskbar.","weight":2},{"id":62,"source":"desktop-docs","text":"- **Title bar:** status dot + `SPEAK · Ctrl+Space to dictate` + `−` minimise + `✕` close (double-click titlebar also minimizes). Drag by the bar only. - **Pill row:** status text (full text in tooltip) → 5-bar wave (grey = mic, ice-blue = voice, gentle idle drift) → hint word (`Listening Working Error Refining Ready`) → **Settings / Guide / Hide**. - **Token bar:** 3 px, green ≤60% → orange ≤85% → red; hover for exact counts + session time. - **Controls:** Transcript toggle (chevron), screen toggle (monitor / eye-off), live interim line. - **Transcript sheet:** word count, **Copy** (flips to `Copied ✓`), **Clear**, read-only text, REFINE buttons + trigger hint.","weight":2},{"id":63,"source":"desktop-docs","text":"- **Close/Hide** stops the session and hides to tray (app keeps running).","weight":2},{"id":64,"source":"desktop-docs","text":"**Mini capsule (`−`, ~330×52, icon-only, no words):**","weight":2},{"id":65,"source":"desktop-docs","text":"- 7-bar live wave in the middle — extends up/down while you speak, stills when silent. **Click the wave to expand.** - Icons only with hover tooltips: Transcript (expands + opens sheet) · Screen toggle (synced) · Settings · Expand · Hide. - Drag by the background/dot. Ideal while presenting or screen-sharing.","weight":2},{"id":66,"source":"desktop-docs","text":"Home base when windows are closed (tooltip `SPEAK · Ctrl+Space to dictate`).","weight":2},{"id":67,"source":"desktop-docs","text":"Menu in order: **Show/Hide capsule · Dictation (Ctrl+Space) · Companion (Ctrl+/) · Purge (Ctrl+Win) · Refine submenu (built-ins + customs, max 6) · Guide · Settings · Exit**. Single/double-click or notification-click toggles the capsule. Balloon notifications confirm saves, refines (`…replaced — N words`), speaker/screen events, sessions, and errors.","weight":2},{"id":68,"source":"desktop-docs","text":"Opens **maximized** (native chrome, Aero Snap intact). **Esc** hides to tray. Sidebar collapses 208 px → 58 px.","weight":2},{"id":69,"source":"desktop-docs","text":"| Page | Use it for | |---|---| | **Setup** | Primary key (paste → **Test** → Save), backup keys (masked `AIzaSy…last4`, auto-switch on quota), free-tier badge. Enter adds. | | **Guide** | Shortcut cards + capsule behavior reference. | | **Preferences** | Mic picker + Refresh · custom words + Mark · system prompt · creativity slider (0–2, default 0.30) · **Share live screen** (motion bursts) · startup launch · **Message Verification** (Active = you press Enter / Auto-Send = automatic) · read-only locks (SMART · HIGH · type + memory). | | **Refine** | Prompts + triggers for Refine/Polish/Elaborate, 3 custom actions, reset defaults.","weight":2},{"id":70,"source":"desktop-docs","text":"| | **Sessions** | Max-stored slider (1–20, default 5), live active/stored counts, stored list (`● active` / `○ stored` + mode/words/time), **New Session** button. | | **Help** | Step-by-step (Screen Share / Transcription / Smart Insertion), shortcut table, troubleshooting. |","weight":2},{"id":71,"source":"desktop-docs","text":"**Permission banner** (amber, top of Settings when screen is blocked): **Grant Permission** fires the native OS prompt + retry; **Later** dismisses. **Save & Launch** validates, refreshes capsule + tray immediately, keeps the capsule hidden until hotkey.","weight":2},{"id":72,"source":"desktop-docs","text":"- **Ctrl+Tab / Sessions → New Session:** spawns a record, stops current audio/screen, starts a fresh companion. Records hold metadata only (id, mode, timestamps, chars/words, status). Oldest non-active evicts first when over max (active is never evicted). Counts are live from launch. - **Ctrl+Win purge:** stops everything, clears transcript + injection history + tokens, hard-resets. Use before sensitive dictation. Memory survives purge by design.","weight":2},{"id":73,"source":"desktop-docs","text":"| Job | Engine | |---|---| | Dictation (speech-to-text) | AI Engine (auto-reconnects on server close) | | Companion (voice+screen+PC) | AI Engine with automatic fallback | | Refine (rewrite) | AI Engine with automatic fallback | | Type + send | `typeTextAtCursor` with Auto-Send (Enter) | | Desktop control | `pc_click / pc_type / pc_scroll / pc_key / pc_hotkey / pc_drag / pc_move / pc_wait` (async, governed: 25-step budget, no-loop guard, audit log) |","weight":2},{"id":74,"source":"desktop-docs","text":"- **Reasoning:** Low / Medium / High, default Medium (Settings > Preferences > Agent Reasoning). - **Failover:** tries the engine automatically, then rotates keys (primary → env → backups → embedded). Stops loudly after 3 failures / 30 s instead of looping. Dictation HTTP-400 hints `pip install -U \\"google-genai>=2.22\\"`. - **Context:** 131k window, live bar + hover counts. Audio ≈ `len/320` tokens/chunk; screen ≈ +560/frame (MEDIUM) or +1120 (HIGH); memory ≤ ~350 tokens. - **Caps:** refine output 4000 chars, deletes 4000, typed history 4000, audio chunk 4 s, queues bounded (mic 200, playback 256, drop-oldest).","weight":2},{"id":75,"source":"desktop-docs","text":"- Mic + screen stream **only during active sessions** — to Google\'s AI service only. No analytics, accounts, or other network calls. - Keys in **Windows Credential Manager** (`SPEAK_AI_App`), never plain files; UI/logs masked (`AIzaSy…last4`, `abc123***wxyz`, `embedded(hidden)`); embedded free-tier key obfuscated (XOR+base64 split). - Config at `%APPDATA%\\\\SPEAK_AI\\\\config.json`: atomic writes, user-only ACL, every value sanitized/clamped on load. - Injection: `SendInput` unicode, no clipboard, no Ctrl+A, never Enter (except Auto-Send path), foreground-verified, 4000-char caps, chunked deletes that abort if focus moves. - Single-instance lock (no double mic/hotkeys).","weight":2},{"id":76,"source":"desktop-docs","text":"Transcript starts fresh each launch; autosave off by default.","weight":2},{"id":77,"source":"desktop-docs","text":"| Symptom | Fix | |---|---| | Nothing types | Click the target app (not SPEAK) → press Enter if Verification Active → retry. Watch wave bars for mic proof. | | `Mic silent / Mic Error` | Preferences → Microphone → Refresh → restart dictation. If Windows blocked it: Settings banner → Grant Permission → allow mic → Grant again. | | Amber screen banner / `Screen blank — voice continues` | Grant Permission → approve OS prompt → Grant again (one click requests mic + screen). Check display/RDP/driver. Voice is unaffected. | | `Screen hiccup — retrying` | Transient send failure — vision auto-retries with backoff, voice continues. If it persists, check network.","weight":2},{"id":78,"source":"desktop-docs","text":"| | `Model unavailable, trying next…` → `Live connect failed` | Setup → Test key; add backup key; check network. | | Refine warns about focus | Click your document, re-say the trigger (original stays in capsule). | | Capsule missing | By design — Ctrl+Space or tray Show. | | `Quota 429` | Add backup keys (auto-switch) or wait; embedded key rotates last. | | Dictation restarts ~10 min | Normal preview cap — auto-reconnect, keep talking. | | Shortcuts clash | Use clean single presses; Ctrl+/ avoids Win+Shift Snip conflicts; Esc never steals focus. |","weight":2},{"id":79,"source":"desktop-docs","text":"Build/install: `pip install -r requirements.txt` → `python build.py` → `dist\\\\SPEAK.exe` → `iscc installer.iss` → `installer\\\\SPEAK_Setup_v2.1.exe` (needs Inno Setup 6, no admin to install). Details in `HOW_TO_INSTALL.md`.","weight":2},{"id":80,"source":"desktop-features","text":"> Voice dictation and live AI companion for Windows 11. By Amir Bagawan.","weight":2},{"id":81,"source":"desktop-features","text":"### Live Voice Dictation (`Ctrl + Space`) - Streams microphone audio (16 kHz mono) to live transcription. - Transcribed speech is typed **directly at the cursor** in whatever app is focused (Notepad, Word, browser, Discord…), sub-second, with multilingual auto-detect. - Floating capsule shows live status, sound-wave visualizer (mic vs voice), interim preview, and a token/context bar.","weight":2},{"id":82,"source":"desktop-features","text":"### Multimodal Live Companion (`Win + Shift`) - Real-time voice conversation with the **AI Engine** (automatic fallback, tried in order automatically). - Optional **live screen sharing** (motion-burst JPEG frames, ~1 fps still / faster on change) so the assistant sees your desktop. Toggle any time via the capsule monitor button or Settings → Live Screen; takes effect mid-session without killing audio. - Replies play through your speakers; capsule shows `Speaking...` / `Listening...` states. - Screen-off mode = voice-only companion.","weight":2},{"id":83,"source":"desktop-features","text":"### Refine / Polish / Elaborate (session delete-and-replace) - Say `refine`, `polish`, or `elaborate` (or tap the capsule buttons / tray menu) to rewrite **everything typed this session** (since purge or dictation start). - The original text is deleted via measured Backspaces and the rewritten version is typed in its place — no clipboard, no `Ctrl+A`, no `Enter` presses. - Prompts are **self-correction aware**: *\\"could you set meeting at 9pm actually 5pm\\"* → *\\"Could we schedule the meeting for 5:00 PM?\\"* (obsolete info dropped, times normalized). - Old trigger word `expand` still works as an alias for Elaborate.","weight":2},{"id":84,"source":"desktop-features","text":"### Custom refine actions (up to 3) - Settings → **Refine tab**: edit the Refine/Polish/Elaborate prompts and their voice trigger words, or add your own actions (e.g. name `Summarize`, trigger `summarize`, custom prompt). - Custom actions appear immediately in the capsule, the tray Refine menu, and voice triggers after Save. Trigger words: `a-z 0-9 -`, 2–24 chars, must be unique.","weight":2},{"id":85,"source":"desktop-features","text":"### Token / context bar - 3 px bar under the capsule: green (0–60%), orange (61–85%), red (86–100%). - Hover shows exact token counts, session time, and remaining buffer.","weight":2},{"id":86,"source":"desktop-features","text":"### Purge (`Ctrl + Win`) - Instantly stops the session, clears transcript + typed history + token counter, and hard-resets the connection.","weight":2},{"id":87,"source":"desktop-features","text":"### Screen drawing canvas - Fullscreen transparent ink layer (`B`/`1-3` color keys, right-click clears, `Esc` exits) for marking the screen while talking to the companion.","weight":2},{"id":88,"source":"desktop-features","text":"### System tray - Show/hide capsule, Dictation, Companion, Purge, Refine submenu, Guide, Settings, Exit. Notifications for save/refine/speaker/screen events.","weight":2},{"id":89,"source":"desktop-features","text":"### Settings (main window, native min/max/close, draggable) - **Setup:** primary + backup API keys (masked display), Test button, free-tier status. - **Guide:** shortcut reference. - **Preferences:** microphone select/refresh, custom vocabulary words + signature mark, system prompt, creativity slider, live-screen toggle, Windows startup. - **Refine:** prompts, triggers, custom actions (see above).","weight":2},{"id":90,"source":"desktop-features","text":"### Design - Authkit “frosted glass cathedral at midnight”: near-black canvas `#05060f`, frost-glass cards, hairline borders, single Void Violet `#663af3` CTA color, pill buttons, blueprint grid + spotlight backdrop in Settings.","weight":2},{"id":91,"source":"desktop-features","text":"| Use | Engine | |-----|-----------| | Dictation | AI Engine (speech-to-text) | | Companion (Live, audio + screen + PC) | AI Engine with automatic fallback | | Refine (one-shot edit) | AI Engine with automatic fallback |","weight":2},{"id":92,"source":"desktop-features","text":"- Reasoning depth is Settings-selectable (`LOW` / `MEDIUM` / `HIGH`, default `MEDIUM`); transcription stays `SMART`-locked. - PC agent tools (`pc_click`, `pc_type`, `pc_scroll`, `pc_key`, `pc_hotkey`, `pc_drag`, …) run desktop UI actions only — no shell — under a 25-step governor with loop refusal, audit log, and stop-word/Esc kill.","weight":2},{"id":93,"source":"desktop-features","text":"- Stored configs with retired IDs are auto-repaired on load; custom engine IDs you entered yourself are never overwritten. - Companion failover: on connection failure the client rotates API keys and retries; after 3 failures in 30 s it stops loudly with an error instead of hot-looping.","weight":2},{"id":94,"source":"desktop-features","text":"### API key storage - Keys live in **Windows Credential Manager** (`keyring`, target `SPEAK_AI_App`), never in plain files. The app JSON config holds only non-secret settings. - UI **masks** keys (`AIza…abcd (39 chars)`); full values stay in Credential Manager and are passed only to Google. - Logs mask keys (`AIza12***abcd`); length/format validated (20–256 chars, `AIza` prefix warned, never enforced).","weight":2},{"id":95,"source":"desktop-features","text":"### Embedded free-tier key - A fallback key ships **obfuscated** (XOR + base64 split parts in `src/_embedded_key.py`) and is used only when the user vault is empty. User keys always take priority when present.","weight":2},{"id":96,"source":"desktop-features","text":"### Config file hardening - Atomic writes (temp file + replace) to `%APPDATA%\\\\SPEAK_AI\\\\config.json`, with `icacls` restricted to the current user. - All loaded values sanitized: temperatures/fps clamped, engine IDs repaired against a known-bad list, prompts capped at 2000 chars with control characters stripped, trigger words restricted to `[a-z0-9-]{2,24}`, custom names to 24 chars, max 3 customs, duplicate triggers rejected.","weight":2},{"id":97,"source":"desktop-features","text":"### Injection safety - Typing uses `SendInput` unicode (multilingual-safe); refined text capped at 4000 chars per replace; Backspace deletes capped at 4000; audio playback chunks capped (192 KB) with a bounded 64-slot queue (oldest dropped, loop never blocked). - Refine refuses to delete while a SPEAK window is focused (tries focus-restore once, else aborts with a warning and keeps history so retry works). - Clipboard is never used for injection; no `Enter` is ever synthesized.","weight":2},{"id":98,"source":"desktop-features","text":"### Runtime safety - **Single-instance lock** (`QLOCKFile` in temp): a second launch shows “already running” instead of double mic/hotkeys. - Hotkeys debounced (600 ms); `Win+Shift` vs `Ctrl+Win` combos are mutually exclusive (three-modifier holds fire nothing); rapid double-press within 1.5 s is ignored rather than restarting the session. - Failover storm guard, bounded session shutdown (3 s), per-task cancellation that never cancels the caller itself. - Audio queue bounded (200, oldest dropped); mic-silence watchdog warns instead of hanging; playback runs on a worker thread with throttled warnings.","weight":2},{"id":99,"source":"desktop-features","text":"- Microphone and screen frames stream **only** while a dictation/companion session is active, and only to Google\'s Gemini API. - Transcript history starts fresh every launch (no restore); autosave off by default. - No analytics, no accounts, no network calls except to Google APIs.","weight":2},{"id":100,"source":"desktop-features","text":"``` cd speak_app venv\\\\Scripts\\\\activate pip install -r requirements.txt # pinned versions python build.py # -> dist\\\\SPEAK.exe (+ SHA256 + SIGNING_NOTE) python build.py --installer # -> + installer\\\\SPEAK_Setup_v2.1.exe (needs Inno Setup 6) ```","weight":2},{"id":101,"source":"desktop-features","text":"- Single-file `--windowed --onefile` build, assets bundled, version metadata stamped (Publisher: Amir Bagawan). - Installer needs no admin rights; optional desktop/startup shortcuts; uninstaller included.","weight":2},{"id":102,"source":"desktop-features","text":"| Symptom | Likely cause | Fix | |---------|--------------|-----| | Companion shows `Model unavailable, trying next...` then `Live connect failed` | Keys invalid/quota or network | Settings → Setup → Test key; add backup key | | `Speaker error / reply dropped`, no voice | Output device busy/missing | Check speaker; restart companion | | `Mic silent / Mic Error` | Wrong input device | Preferences → Microphone → Refresh | | Refine says `Click your document, then <word>` | Capsule had focus | Click target app, say trigger again (hands-free works best) | | Capsule hidden | By design (hotkey-only) | `Ctrl+Space`, or tray → Show capsule | | `Live connect keeps failing` | Bad stored engine IDs | Fixed automatically on load; otherwise check keys/network |","weight":2}]'),mO=pO,gO=new Set(["the","a","an","and","or","but","is","are","was","were","be","to","of","in","on","for","with","how","what","does","do","it","my","your","voxula","ai","app","can","use","using","this","that","have","has","will","would","should","could","there","their","they","them","from","about","into","over","you","please","tell","show","get","i","me","any","where","which","who","when","why"]);function Y_(i){return i.toLowerCase().replace(/[^a-z0-9+\s#._-]/g," ").split(/\s+/).filter(t=>t.length>1&&!gO.has(t))}function q_(i){const t=i.toLowerCase().trim();if(t.includes("install")||t.includes("download")||t.includes("setup")||t.includes("get started"))return`To install Voxula AI (${ds}):
